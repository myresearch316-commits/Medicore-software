databases:
  - name: medicore-db
    databaseName: medicore
    user: medicore
    plan: free

services:
  - type: web
    name: medicore-hms
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medicore-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"
